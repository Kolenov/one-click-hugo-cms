name: Merge to Main

# Automatically merge content-management into main after successful PR merges
on:
  push:
    branches:
      - content-management
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          PR_NUMBER=$(gh pr list --base main --head content-management --json number --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "📝 PR #$PR_NUMBER already exists"
            # Enable auto-merge if not already enabled
            gh pr merge "$PR_NUMBER" --auto --squash || echo "Auto-merge already enabled or PR not ready"
          else
            echo "🆕 Creating new PR content-management → main"
            # Create new PR with auto-merge
            gh pr create \
              --base main \
              --head content-management \
              --title "🚀 Sync content-management to main" \
              --body "Automated PR to sync content changes from content-management to main.

            This will trigger the Netlify build automatically after merge.

            Changes include:
            - Content updates from DecapCMS
            - Optimized images
            - Any other content-related changes" \
              --label "auto-merge"

            # Get the new PR number and enable auto-merge
            NEW_PR_NUMBER=$(gh pr list --base main --head content-management --json number --jq '.[0].number')
            if [ -n "$NEW_PR_NUMBER" ]; then
              gh pr merge "$NEW_PR_NUMBER" --auto --squash
              echo "✅ Auto-merge enabled for PR #$NEW_PR_NUMBER"
            fi
          fi

      - name: Summary
        run: |
          echo "✨ Workflow complete!"
          echo "The PR will be automatically merged when all checks pass."
          echo "After merge to main, Netlify will automatically start the build."
